[package]
name = "workspace"
version = "0.1.0"
edition = "2024"

[dependencies]
# Regular dependencies
ammonia = "4.1.2"
anyhow = "1.0.100"
askama = "0.16.0"
async-stream = "0.3.6"
axum = "0.8.6"
axum-extra = { version = "0.12.0", features = ["cookie"] }
base64 = "0.22"
chrono = "0.4.42"
config = "0.15.18"
console_error_panic_hook = "0.1"
futures = "0.3.32"
hmac = "0.12.1"
html-escape = "0.2.13"
jsonwebtoken = { version = "10.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
juniper = { version = "0.17.1", features = ["uuid", "chrono"] }
juniper_axum = "0.3.0"
opentelemetry = { version = "0.31.0", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.31.0", features = ["http-proto", "metrics", "reqwest-client", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["metrics", "rt-tokio", "trace"] }
pinyin = "0.11"
pinyinchch = { version = "0.3.0", features = ["hmm"] }
pinyinchch-model-hmm = "0.3.0"
prost = "0.14.4"
prost-types = "0.14.4"
protoc-gen-prost = "0.5.0"
protoc-gen-tonic = "0.5.0"
rand = "0.9.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rsa = { version = "0.9.8", features = ["pem", "sha2"] }
rusqlite = { version = "0.32.1", features = ["bundled", "limits"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sea-orm = { version = "1.1.16", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
sea-orm-migration = { version = "1.1.0", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "cli",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
subtle = "2.6.1"
sqlx = { version = "0.9", features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring-webpki",
  "uuid",
  "chrono",
  "macros",
  "migrate",
] }
serde_yaml = "0.9.34"
tempfile = "3.27.0"
thiserror = "2.0.17"
time = "0.3.44"
tokio = { version = "1.47.1", default-features = false, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1.18", features = ["net", "sync"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.0", features = [
  "cors",
  "fs",
  "limit",
  "request-id",
  "sensitive-headers",
  "timeout",
  "trace",
] }
tracing = "0.1.41"
tracing-futures = "0.2.5"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = "0.3.20"
url = "2.5.7"
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "debug-embed"] }
uuid = { version = "1.18.1", features = ["serde", "v4", "v7", "v8"] }
wasm-bindgen = "=0.2.105"
zip = { version = "3.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
googletest = "0.14.3"
insta = { version = "1.43.2", features = ["yaml"] }
mockall = "0.15.0"
regex = "1.11.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
