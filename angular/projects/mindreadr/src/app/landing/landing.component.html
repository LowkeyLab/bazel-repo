<section class="hero mt-8 md:mt-12 px-4">
  <div class="hero-content flex-col max-w-2xl w-full">
    <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-center">
      Mindreadr
    </h1>
    <p class="opacity-70 text-center">
      A cooperative word-guessing game for two players.
    </p>

    <div class="card w-full bg-base-100 shadow">
      <div class="card-body">
        <h2 class="card-title">How to Play</h2>
        <ul class="list-disc pl-6 space-y-2 text-sm md:text-base">
          <li>Both players think of any word and submit it.</li>
          <li>See both words. Then, each player submits a new word.</li>
          <li>
            When both players submit the exact same word in a round, you win!
          </li>
        </ul>

        <div class="card-actions mt-4">
          <button class="btn btn-primary w-full md:w-auto" routerLink="/games">
            Browse Games
          </button>
        </div>
      </div>
    </div>

    <mindreadr-games-count class="block mt-8 w-full"></mindreadr-games-count>
  </div>
</section>
