<div class="min-h-screen flex items-center justify-center bg-base-200 px-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body space-y-4">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏟️</span>
        <div>
          <p class="text-sm text-secondary">Welcome to</p>
          <h1 class="text-3xl font-bold">Predix</h1>
        </div>
      </div>

      <p class="text-sm text-secondary">
        Sign in to create circles, open contests, and make predictions. New
        here?
        <a class="link" routerLink="/register">Create an account</a>.
      </p>

      <form (submit)="onSubmit($event)" class="space-y-3">
        <div class="space-y-2">
          <span class="label-text text-sm">Username</span>
          <label
            class="input input-bordered flex items-center gap-3 w-full"
            aria-label="Username"
          >
            <svg
              class="h-[1em] opacity-60"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <g
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2"
                fill="none"
                stroke="currentColor"
              >
                <circle cx="12" cy="7" r="4"></circle>
                <path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>
              </g>
            </svg>
            <input
              type="text"
              class="grow"
              [(ngModel)]="username"
              name="username"
              autocomplete="username"
              required
              placeholder="your-handle"
            />
          </label>
        </div>

        <div class="space-y-2">
          <span class="label-text text-sm">Password</span>
          <label
            class="input input-bordered flex items-center gap-3 w-full"
            aria-label="Password"
          >
            <svg
              class="h-[1em] opacity-60"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <g
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2"
                fill="none"
                stroke="currentColor"
              >
                <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
              </g>
            </svg>
            <input
              type="password"
              class="grow"
              [(ngModel)]="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
            />
          </label>
        </div>

        @if (error()) {
          <div class="alert alert-error">
            <span>{{ error() }}</span>
          </div>
        }

        <div class="card-actions justify-end">
          <button type="submit" class="btn btn-primary" [disabled]="loading()">
            @if (loading()) {
              <span class="loading loading-spinner"></span>
            }
            Sign in
          </button>
        </div>
      </form>

      <p class="text-xs text-secondary">
        Tip: accounts are created via the register flow—then come back to sign
        in.
      </p>
    </div>
  </div>
</div>
