<div class="min-h-screen flex items-center justify-center bg-base-200 px-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body space-y-4 text-center">
      <div class="flex items-center justify-center gap-2">
        <span class="text-2xl">🏟️</span>
        <div>
          <p class="text-sm text-secondary">Welcome to</p>
          <h1 class="text-3xl font-bold">Predix</h1>
        </div>
      </div>

      <p class="text-sm text-secondary">
        Sign in to create circles, open contests, and make predictions.
      </p>

      <div class="card-actions justify-center pt-4">
        <button
          type="button"
          class="btn btn-primary btn-wide"
          (click)="onLogin()"
        >
          Login with Authorizer
        </button>
      </div>

      <p class="text-xs text-secondary mt-4">
        Don't have an account?
        <a class="link" routerLink="/register">Register</a>
      </p>
    </div>
  </div>
</div>
