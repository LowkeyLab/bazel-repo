<div
  class="min-h-screen flex items-center justify-center bg-base-200 px-4 py-10"
>
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body space-y-6 text-center">
      <div class="flex items-center justify-center gap-2">
        <span class="text-2xl">✨</span>
        <div>
          <h1 class="text-3xl font-bold">Join Predix</h1>
        </div>
      </div>

      <p class="text-sm text-secondary leading-relaxed">
        Claim your handle, start a Circle, and launch your first contest.
      </p>

      <div class="card-actions justify-center pt-4">
        <button
          type="button"
          class="btn btn-primary btn-wide"
          (click)="onRegister()"
        >
          Sign Up with Authorizer
        </button>
      </div>

      <p class="text-xs text-secondary mt-4">
        Already have an account? <a class="link" routerLink="/login">Sign in</a>
      </p>
    </div>
  </div>
</div>
