<div class="min-h-screen bg-base-200">
  <div class="navbar bg-base-100 shadow-lg">
    <div class="flex-1">
      <a routerLink="/" class="btn btn-ghost text-xl">🏟️ Predix</a>
    </div>
    <div class="flex-none flex items-center gap-3">
      <ul class="menu menu-horizontal px-1">
        <li>
          <a routerLink="/" routerLinkActive="active">Home</a>
        </li>
        <li>
          <a routerLink="/circles" routerLinkActive="active">Circles</a>
        </li>
        <li>
          <a routerLink="/contests" routerLinkActive="active">Contests</a>
        </li>
      </ul>

      @if (isAuthenticated()) {
      <div class="flex items-center gap-2">
        <div class="badge badge-outline">
          {{ auth.currentUser()?.username || 'Anonymous' }}
        </div>
        <button class="btn btn-sm" (click)="logout()">Logout</button>
      </div>
      } @else {
      <div class="flex items-center gap-2">
        <a class="btn btn-ghost btn-sm" routerLink="/login">Login</a>
        <a class="btn btn-primary btn-sm" routerLink="/register">Register</a>
      </div>
      }
    </div>
  </div>
  <main><router-outlet /></main>
  <footer class="footer footer-center p-4 bg-base-100 text-base-content mt-8">
    <aside><p>Predix © 2025</p></aside>
  </footer>
</div>
