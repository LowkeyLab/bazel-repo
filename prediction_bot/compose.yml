services:
  postgres:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    environment:
      POSTGRES_DB: prediction_bot
      POSTGRES_USER: prediction_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prediction_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prediction_owner -d prediction_bot"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  prediction_postgres:
