version: '3.8'
services:
  predix:
    image: lowkeylab/predix_backend:latest
    container_name: predix-app
    ports:
      - "8080:8080"
    environment:
      AUTHORIZER_URL: "http://authorizer:8081"
      AUTHORIZER_CLIENT_ID: "f0d9bdfc-af49-4baa-a974-04bedea878b3"
      ALLOWED_ORIGINS: "http://localhost:4200"
      DATABASE_URL: "postgres://predix:predix_password@postgres:5432/predix_db?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - predix-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    image: lowkeylab/predix_frontend:latest
    container_name: predix-frontend
    ports:
      - "80:80"
    networks:
      - predix-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  postgres:
    image: postgres:18
    container_name: predix-postgres
    environment:
      POSTGRES_USER: predix
      POSTGRES_PASSWORD: predix_password
      POSTGRES_DB: predix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    networks:
      - predix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predix -d predix_db"]
      interval: 10s
      timeout: 5s
      retries: 5
  authorizer:
    image: lakhansamani/authorizer:1.4.4
    container_name: authorizer
    ports:
      - "8081:8080"
    environment:
      ENV: development
      DATABASE_TYPE: postgres
      DATABASE_URL: postgres://predix:predix_password@postgres:5432/predix_db?sslmode=disable
      ADMIN_SECRET: admin
    depends_on:
      - postgres
    networks:
      - predix-network
networks:
  predix-network:
    driver: bridge
volumes:
  postgres:
