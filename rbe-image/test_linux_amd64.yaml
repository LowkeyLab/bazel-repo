schemaVersion: "2.0.0"

commandTests:
  - name: "echo hello"
    command: "/bin/bash"
    args: ["-c", "echo hello world!"]
    expectedOutput: ["hello world!"]
  - name: "check sed"
    command: "/bin/bash"
    args: ["-c", "echo 'foo' | sed 's/foo/bar/'"]
    expectedOutput: ["bar"]
  - name: "check gawk"
    command: "/bin/bash"
    args: ["-c", "echo 'one two three' | gawk '{print $3}'"]
    expectedOutput: ["three"]
  - name: "check awk"
    command: "/bin/bash"
    args: ["-c", "echo 'alpha beta gamma' | awk '{print $2}'"]
    expectedOutput: ["beta"]
  - name: "check curl"
    command: "/bin/bash"
    args: ["-c", "curl --version | head -n 1"]
    expectedOutput: ["curl"]