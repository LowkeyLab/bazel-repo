services:
  postgres:
    image: postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment:
      POSTGRES_DB: nicknamer2
      POSTGRES_USER: nicknamer2
      POSTGRES_PASSWORD: nicknamer2
    ports:
      - "5433:5432"
    volumes:
      - nicknamer2_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nicknamer2 -d nicknamer2"]
      interval: 5s
      timeout: 5s
      retries: 5
  casdoor-db:
    image: postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    environment:
      POSTGRES_DB: casdoor
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: casdoor
    volumes:
      - casdoor_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor -d casdoor"]
      interval: 5s
      timeout: 5s
      retries: 5
  casdoor:
    image: casbin/casdoor:4.22.0@sha256:29624af41b03eb1d655685d5ae28a32115fdde96b745c824eb3ed631d437bf41
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./casdoor/conf:/conf
    depends_on:
      casdoor-db:
        condition: service_healthy
volumes:
  nicknamer2_postgres_data:
  casdoor_postgres_data:
