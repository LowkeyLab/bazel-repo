services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: nicknamer2
      POSTGRES_USER: nicknamer2
      POSTGRES_PASSWORD: nicknamer2
    ports:
      - "5433:5432"
    volumes:
      - nicknamer2_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nicknamer2 -d nicknamer2"]
      interval: 5s
      timeout: 5s
      retries: 5
  casdoor-db:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: casdoor
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: casdoor
    volumes:
      - casdoor_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor -d casdoor"]
      interval: 5s
      timeout: 5s
      retries: 5
  casdoor:
    image: casbin/casdoor:4.18.0@sha256:30c176f544bc2a24391a44d85c174e6647f79c85652df59d786f0a10d9225c9b
    ports:
      - "8000:8000"
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./casdoor/conf:/conf
    depends_on:
      casdoor-db:
        condition: service_healthy
volumes:
  nicknamer2_postgres_data:
  casdoor_postgres_data:
