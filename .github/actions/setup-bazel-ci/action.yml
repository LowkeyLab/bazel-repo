name: Setup Bazel CI
description: Shared setup for Bazel CI jobs
inputs:
  aspect-api-token:
    description: Aspect API token used to create a session for CI tasks
    required: true
  buildbuddy-api-key:
    description: BuildBuddy API key used for remote Bazel access
    required: true
  docker-hub-username:
    description: Docker Hub username used for authenticated pulls
    required: true
  docker-hub-token:
    description: Docker Hub token used for authenticated pulls
    required: true
  cache-name:
    description: Public Cachix cache name
    default: ''
  public-key:
    description: Maintainer verified Cachix signing key
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-nix-tool
      with:
        tool: aspect
        cache-name: ${{ inputs.cache-name }}
        public-key: ${{ inputs.public-key }}
    - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
      with:
        # Avoid downloading Bazel every time.
        bazelisk-cache: true
        repository-cache: false
        bazelrc: |
          common --config=ci
          common --remote_download_outputs=all
          common --nobuild_event_binary_file_path_conversion
          common:lint --config=ci-lint
          common:lint --build_tag_filters=-no-lint
          common --remote_header=x-buildbuddy-api-key=${{ inputs.buildbuddy-api-key }}
          test --test_env=XDG_CACHE_HOME
    - name: Authenticate Aspect
      uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
      with:
        launcher-install: false
        bazelrc-generate: false
        aspect-api-token: ${{ inputs.aspect-api-token }}
    - name: Log in to Docker Hub
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
      with:
        username: ${{ inputs.docker-hub-username }}
        password: ${{ inputs.docker-hub-token }}
