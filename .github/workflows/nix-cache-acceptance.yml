name: Nix cache acceptance
on:
  workflow_dispatch:
  pull_request:
    types: [opened, labeled, synchronize, reopened]
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nix-cache-acceptance')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tool: [aspect, lcov]
    uses: ./.github/workflows/prepare-nix-tools.yml
    with:
      tool: ${{ matrix.tool }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  fresh-download:
    needs: prepare
    # always() permits manual runs after intentionally skipped preparation.
    # PR readers require every preparation matrix job to complete successfully.
    if: ${{ always() && !cancelled() && ((github.event_name == 'workflow_dispatch' && needs.prepare.result == 'skipped') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nix-cache-acceptance') && needs.prepare.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        tool: [aspect, lcov]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No restored Nix store and no tool build before the strict absence check.
      # No upload or unrelated service secrets are passed to this job.
      - uses: ./.github/actions/install-nix-tool
        with:
          tool: ${{ matrix.tool }}
          install-only: 'true'
          cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          public-key: ${{ vars.CACHIX_PUBLIC_KEY }}
      - name: Require fresh signed download and actual source evidence
        env:
          NIX_TOOL: ${{ matrix.tool }}
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_PUBLIC_KEY: ${{ vars.CACHIX_PUBLIC_KEY }}
        run: python3 .github/scripts/nix_tool.py strict "$NIX_TOOL"
      - name: Exercise deployment binary installation without deployment
        if: matrix.tool == 'aspect'
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/nix-acceptance-aspect
        run: |
          ASPECT_PATH=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["output"])' "$EVIDENCE_DIR/result.json")
          status=0
          {
            install -Dm755 "$ASPECT_PATH/bin/aspect" /usr/local/bin/aspect &&
              /usr/local/bin/aspect --version
          } > "$EVIDENCE_DIR/deployment-install.stdout" 2> "$EVIDENCE_DIR/deployment-install.stderr" || status=$?
          printf '%s\n' "$status" > "$EVIDENCE_DIR/deployment-install.exit-status"
          cat "$EVIDENCE_DIR/deployment-install.stdout"
          cat "$EVIDENCE_DIR/deployment-install.stderr" >&2
          exit "$status"
      - name: Retain strict acceptance evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nix-cache-acceptance-${{ matrix.tool }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nix-acceptance-${{ matrix.tool }}/
          if-no-files-found: error
  cache-failures:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nix-cache-failures')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-nix-tool
        with:
          install-only: 'true'
      - name: Resolve pinned publication client without credentials
        id: client
        run: |
          client=$(nix build --no-link --print-out-paths --no-update-lock-file --inputs-from . nixpkgs#cachix)
          echo "path=$client" >> "$GITHUB_OUTPUT"
      - name: Exercise real Nix failures and ordinary source fallback
        env:
          CACHIX_PATH: ${{ steps.client.outputs.path }}
        run: python3 .github/scripts/nix_cache_failures.py
      - name: Retain fault evidence including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nix-cache-failures-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nix-acceptance-failures/
          if-no-files-found: error
