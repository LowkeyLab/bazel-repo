name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    # Use the same runner as your CI to ensure compatibility
    # glibc version 2.36 is required for base distroless image
    runs-on: ubuntu-22.04

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read

    # Set environment variables that tools might need
    env:
      MISE_EXPERIMENTAL: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@4432ac8a2318fb254c5b9fe491b9d21a002d7122
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true

      - name: Copy API key to root .bazelrc
        run: |
          echo "=== Adding BuildBuddy API key to .bazelrc ==="
          echo "build --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" >> ~/.bazelrc

        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Put copilot.bazelrc contents into ~/.bazelrc
        run: |
          cat $GITHUB_WORKSPACE/.github/workflows/copilot.bazelrc >> ~/.bazelrc

      - name: Install tools via bazel
        run: |
          echo "bazel-out/bazel_env-opt/bin/tools/bazel_env/bin" >> $GITHUB_PATH

      - name: Verify tool installations
        run: |
          echo "=== Java version ==="
          java -version
          
          echo "=== Bazel version ==="
          bazel version

      - name: Log in to Docker Hub
        uses: docker/login-action@28fdb31ff34708d19615a74d67103ddc2ea9725c
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416

      - name: Check Bazel info
        run: |
          echo "=== Checking Bazel info ==="
          bazel info
