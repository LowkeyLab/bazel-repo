name: "Copilot Setup Steps"
# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read
    # Set environment variables that tools might need
    env:
      MISE_EXPERIMENTAL: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@92148bb48b9a0c5458c53dd0b368fbfbfbaa3210
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Configure Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39
      - name: Configure CI Bazel settings
        run: |
          cat > "$GITHUB_WORKSPACE/user.bazelrc" <<'EOF'
          common --config=ci
          common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
          test --test_env=XDG_CACHE_HOME
          EOF
      - name: Install tools via flake
        run: |
          nix develop --command bash -lc 'echo "$PATH" | tr ":" "\n" >> "$GITHUB_PATH"'
      - name: Verify tool installations
        run: |
          nix develop --command bash -lc '
            echo "=== Java version ==="
            java -version

            echo "=== Bazel version ==="
            bazel version

            echo "=== Aspect version ==="
            aspect --version

            echo "=== Tool locations ==="
            command -v aspect
            command -v buildifier
            command -v prettier
            command -v starpls
            command -v pnpm
            command -v go
            command -v format
            command -v coverage
          '
      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416
