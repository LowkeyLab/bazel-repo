name: Publish Book Smartz browser worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          repository-cache: false
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Validate worker runtime and resolve artifact
        id: image
        run: |
          gpgv --version
          bazel test //tools/book_smartz_browser_worker:runtime_test --nocache_test_results --test_output=errors
          bazel build //tools/book_smartz_browser_worker:image.digest
          digest=$(cat bazel-bin/tools/book_smartz_browser_worker/image.json.sha256)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Publishing commit: $GITHUB_SHA"
            echo "Runtime-validated worker: $digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tooling image
        run: bazel run //tools/book_smartz_browser_worker:push_image -- --tag "sha-$GITHUB_SHA"
  anonymous-access:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          repository-cache: false
          bazelrc: |
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Retrieve and validate all image content anonymously
        env:
          WORKER_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          image="ghcr.io/lowkeylab/book_smartz_browser_worker@$WORKER_DIGEST"
          bazel run @multitool//tools/crane -- pull "$image" "$RUNNER_TEMP/worker.tar"
          bazel run @multitool//tools/crane -- validate --tarball "$RUNNER_TEMP/worker.tar"
          {
            echo "Publishing commit: $GITHUB_SHA"
            echo "Anonymous full-image retrieval and validation passed: $image"
            echo "Downloaded archive bytes: $(stat -c %s "$RUNNER_TEMP/worker.tar")"
            echo "Consumer enablement follows in #2373; this run does not prove remote browser execution."
          } >> "$GITHUB_STEP_SUMMARY"
