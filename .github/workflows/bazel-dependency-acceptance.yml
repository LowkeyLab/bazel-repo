name: Bazel dependency restore acceptance
on:
  pull_request:
    paths:
      - .github/scripts/bazel_dependenc*.py
      - .github/workflows/bazel-dependency-acceptance.yml
      - .github/workflows/run-tests.yml
permissions:
  contents: read
jobs:
  restore-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fault: [miss, error, stall]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          repository-cache: false
      - name: Configure shared dependency cache
        run: python3 .github/scripts/bazel_dependencies.py configure
      - name: Start isolated endpoint and public dependency fixture
        env:
          FAULT_MODE: ${{ matrix.fault }}
        run: python3 .github/scripts/bazel_dependency_faults.py start "$FAULT_MODE"
      - name: Restore against isolated fault endpoint (advisory)
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        timeout-minutes: 2
        continue-on-error: true
        env:
          ACTIONS_CACHE_SERVICE_V2: 'true'
          ACTIONS_RESULTS_URL: ${{ env.FAULT_URL }}
          ACTIONS_RUNTIME_TOKEN: isolated-fault-token
        with:
          path: ${{ env.BAZEL_DEPENDENCY_CACHE }}
          key: ${{ env.BAZEL_DEPENDENCY_PREFIX }}fault-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.BAZEL_DEPENDENCY_PREFIX }}
      - name: Record restore completion before preparation
        env:
          FAULT_MODE: ${{ matrix.fault }}
        run: python3 .github/scripts/bazel_dependency_faults.py restored "$FAULT_MODE"
      - name: Run real required preparation after restore fault
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.dependencies.outcome }}
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.dependencies.outputs.cache-matched-key }}
        run: |
          script="$PWD/.github/scripts/bazel_dependencies.py"
          cd "$FAULT_WORKSPACE"
          python3 "$script" prepare | tee "$FAULT_EVIDENCE/preparation.log"
      - name: Require observed fallback, cleanup, deadline, and integrity failure
        env:
          FAULT_MODE: ${{ matrix.fault }}
          RESTORE_OUTCOME: ${{ steps.dependencies.outcome }}
        run: python3 .github/scripts/bazel_dependency_faults.py verify "$FAULT_MODE"
      - name: Retain credential-free raw fault evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bazel-dependency-${{ matrix.fault }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-dependency-faults/
          if-no-files-found: error
