name: Bazel dependency cache acceptance
on:
  workflow_dispatch:
    inputs:
      audit-only:
        description: Run only the fresh-runner material audit
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/scripts/bazel_dependenc*.py
      - .github/workflows/bazel-dependency-acceptance.yml
      - .github/workflows/run-tests.yml
permissions:
  contents: read
jobs:
  restore-faults:
    if: github.event_name != 'workflow_dispatch' || !inputs.audit-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fault: [miss, error, stall]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          repository-cache: false
      - name: Configure shared dependency cache
        run: python3 .github/scripts/bazel_dependencies.py configure
      - name: Start isolated endpoint and public dependency fixture
        env:
          FAULT_MODE: ${{ matrix.fault }}
        run: python3 .github/scripts/bazel_dependency_faults.py start "$FAULT_MODE"
      - name: Restore against isolated fault endpoint (advisory)
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        timeout-minutes: 2
        continue-on-error: true
        env:
          NODE_OPTIONS: --require=${{ env.FAULT_EVIDENCE }}/cache-env.cjs
          ACTIONS_CACHE_SERVICE_V2: 'true'
          ACTIONS_RESULTS_URL: ${{ env.FAULT_URL }}
          ACTIONS_RUNTIME_TOKEN: isolated-fault-token
        with:
          path: ${{ env.BAZEL_DEPENDENCY_CACHE }}
          key: ${{ env.BAZEL_DEPENDENCY_PREFIX }}fault-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.BAZEL_DEPENDENCY_PREFIX }}
      - name: Record restore completion before preparation
        env:
          FAULT_MODE: ${{ matrix.fault }}
        run: python3 .github/scripts/bazel_dependency_faults.py restored "$FAULT_MODE"
      - name: Run real required preparation after restore fault
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.dependencies.outcome }}
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.dependencies.outputs.cache-matched-key }}
        run: |
          script="$PWD/.github/scripts/bazel_dependencies.py"
          cd "$FAULT_WORKSPACE"
          python3 "$script" prepare | tee "$FAULT_EVIDENCE/preparation.log"
      - name: Require observed fallback, cleanup, deadline, and integrity failure
        env:
          FAULT_MODE: ${{ matrix.fault }}
          RESTORE_OUTCOME: ${{ steps.dependencies.outcome }}
        run: python3 .github/scripts/bazel_dependency_faults.py verify "$FAULT_MODE"
      - name: Retain credential-free raw fault evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bazel-dependency-${{ matrix.fault }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-dependency-faults/
          if-no-files-found: error
  save-faults:
    if: github.event_name != 'workflow_dispatch' || !inputs.audit-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fault: [error, stall]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          repository-cache: false
      - name: Configure shared dependency cache
        run: python3 .github/scripts/bazel_dependencies.py configure
      - name: Start isolated save endpoint and public dependency fixture
        env:
          FAULT_MODE: ${{ matrix.fault }}
        run: python3 .github/scripts/bazel_dependency_faults.py start "$FAULT_MODE"
      - name: Prepare the real dependency fixture before save
        run: |
          script="$PWD/.github/scripts/bazel_dependencies.py"
          cd "$FAULT_WORKSPACE"
          python3 "$script" prepare | tee "$FAULT_EVIDENCE/preparation.log"
      - name: Run successful fixture workload
        run: |
          cd "$FAULT_WORKSPACE"
          bazel build --config=ci //:fixture
      - name: Record save start
        run: date +%s.%N > "$FAULT_EVIDENCE/save-started"
      - name: Save against isolated fault endpoint (advisory)
        id: dependency-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        timeout-minutes: 2
        continue-on-error: true
        env:
          NODE_OPTIONS: --require=${{ env.FAULT_EVIDENCE }}/cache-env.cjs
          ACTIONS_CACHE_SERVICE_V2: 'true'
        with:
          path: ${{ env.BAZEL_DEPENDENCY_CACHE }}
          key: ${{ env.BAZEL_DEPENDENCY_PREFIX }}save-fault-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Require save fault evidence and preserved workload success
        env:
          FAULT_MODE: ${{ matrix.fault }}
          SAVE_OUTCOME: ${{ steps.dependency-save.outcome }}
        run: python3 .github/scripts/bazel_dependency_faults.py verify-save "$FAULT_MODE"
      - name: Retain credential-free raw save fault evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bazel-dependency-save-${{ matrix.fault }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-dependency-faults/
          if-no-files-found: error
  snapshot-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          repository-cache: false
      - name: Configure dependency cache without service credentials
        run: python3 .github/scripts/bazel_dependencies.py configure
      - name: Prepare public dependencies on a fresh runner
        run: python3 .github/scripts/bazel_dependencies.py prepare | tee "$RUNNER_TEMP/preparation.log"
      - name: Inspect material without publication
        run: python3 .github/scripts/bazel_dependencies.py inspect
      - name: Record audit provenance
        if: always()
        run: |
          {
            printf 'Revision: %s\nRunner: %s\nRef: %s\n' "$GITHUB_SHA" "$RUNNER_NAME" "$GITHUB_REF"
            bazel version
            uname -a
          } > "$RUNNER_TEMP/audit-provenance.txt"
      - name: Retain credential-free audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bazel-dependency-audit-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bazel-dependency-inventory.json
            ${{ runner.temp }}/preparation.log
            ${{ runner.temp }}/audit-provenance.txt
          if-no-files-found: error
