      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        timeout-minutes: 2
        with:
          path: ~/.cache/native-transport
          key: bazel-native-acceptance-v1-${{ github.run_id }}-expanded
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: transport-fixture-${{ env.FIXTURE_MODE }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-transport/result.json
            ${{ runner.temp }}/native-transport/query.log
          if-no-files-found: error
  reuse-published-addition:
