name: Temporary native snapshot transport acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [a, b]
    env:
      FIXTURE_MODE: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 6e91b4e8692674204289d42b3873ba9343131273
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          repository-cache: false
      - name: Run the real fixture and verify output
        run: |
          cat > "$RUNNER_TEMP/transport-fixture.py" <<'PYTHON'
          import hashlib
          import http.server
          import json
          import os
          from pathlib import Path
          import subprocess
          import threading
          import time

          mode=os.environ['FIXTURE_MODE']
          root=Path(os.environ['RUNNER_TEMP'])/'native-transport'
          root.mkdir(exist_ok=True)
          workspace=root/'workspace'
          workspace.mkdir(exist_ok=True)
          cache=Path.home()/'.cache'/'native-transport'
          payloads={'a':b'public dependency one\n','b':b'public dependency two\n'}
          requests=[]
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body=payloads.get(self.path.strip('/'))
                  requests.append({'path':self.path,'bytes':len(body or b'')})
                  self.send_response(200 if body else 404)
                  self.end_headers()
                  if body:self.wfile.write(body)
              def log_message(self,*_):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',18643),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          (workspace/'BUILD.bazel').write_text('')
          (workspace/'deps.bzl').write_text('''def _repo(ctx):
              print("RULE_EXECUTED " + ctx.attr.label)
              ctx.download(url = ctx.attr.url, output = "material", sha256 = ctx.attr.sha256)
              ctx.file("BUILD.bazel", 'exports_files(["material"])\\n')
              return ctx.repo_metadata(reproducible = True)
          repo = repository_rule(implementation = _repo, attrs = {"url": attr.string(), "sha256": attr.string(), "label": attr.string()})
          ''')
          module='module(name = "transport_fixture")\nrepo = use_repo_rule("//:deps.bzl", "repo")\n'
          for key,body in payloads.items():
              module+=f'repo(name = "fixture_{key}", label = "{key}", url = "http://127.0.0.1:18643/{key}", sha256 = "{hashlib.sha256(body).hexdigest()}")\n'
          (workspace/'MODULE.bazel').write_text(module)
          query='@fixture_'+mode+'//:material' if mode in ('a','b') else 'set(@fixture_a//:material @fixture_b//:material)'
          output=root/'output'
          assert not output.exists()
          cmd=['bazel','--batch','--nosystem_rc','--nohome_rc','--noworkspace_rc',f'--output_base={output}','query',query,f'--repository_cache={cache}',f'--repo_contents_cache={cache}/contents','--incompatible_autoload_externally=']
          started=time.monotonic()
          try:
              result=subprocess.run(cmd,cwd=workspace,env=dict(os.environ,USE_BAZEL_VERSION='9.3.1'),stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              (root/'query.log').write_text(result.stdout)
              correct={}
              for key in (mode,) if mode in ('a','b') else ('a','b'):
                  correct[key]=(output/f'external/+repo+fixture_{key}/material').read_bytes()==payloads[key]
              d={'mode':mode,'runner':os.environ['RUNNER_NAME'],'revision':os.environ['GITHUB_SHA'],'ref':os.environ['GITHUB_REF'],'seconds':time.monotonic()-started,'exit':result.returncode,'requests':requests,'correct':correct,'rule_executed':{key:'RULE_EXECUTED '+key in result.stdout for key in ('a','b')},'command':cmd,'scope':'Fixture HTTP requests and bytes are complete. Bazelisk and registry traffic are outside this observation.'}
              (root/'result.json').write_text(json.dumps(d,indent=2)+'\n')
              print(json.dumps(d),flush=True)
              assert result.returncode==0 and all(correct.values()),d
              if mode in ('a','b'):assert requests==[{'path':'/'+mode,'bytes':22}],d
              if mode=='add':assert requests==[{'path':'/b','bytes':22}] and not d['rule_executed']['a'],d
              if mode=='reuse':assert not requests and not any(d['rule_executed'].values()),d
          finally:server.shutdown()
          PYTHON
          python3 "$RUNNER_TEMP/transport-fixture.py"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        timeout-minutes: 2
        with:
          path: ~/.cache/native-transport
          key: bazel-native-acceptance-v1-${{ github.run_id }}-${{ matrix.seed }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: transport-fixture-${{ env.FIXTURE_MODE }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-transport/result.json
            ${{ runner.temp }}/native-transport/query.log
          if-no-files-found: error
  fetch-missing-addition:
    needs: independent-seeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIXTURE_MODE: add
    steps:
