name: Temporary extraction-timeout acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: a3567e24ac5c8e51b8fc4b75409a6e769ee985db
      - name: Prepare public fault material
        run: |
          mkdir -p "$HOME/.cache/bazel-repo"
          printf 'public extraction fixture\n' > "$HOME/.cache/bazel-repo/material"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        timeout-minutes: 2
        with:
          path: ~/.cache/bazel-repo
          key: bazel-extraction-fault-v1-${{ github.run_id }}-${{ github.run_attempt }}
  extraction-timeout:
    needs: isolated-entry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: a3567e24ac5c8e51b8fc4b75409a6e769ee985db
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          repository-cache: false
      - run: python3 .github/scripts/bazel_dependencies.py configure
      - name: Start the public dependency fixture
        run: python3 .github/scripts/bazel_dependency_faults.py start miss
      - name: Inject a real GNU tar extraction stall
        run: |
          mkdir "$RUNNER_TEMP/slow-restore"
          cat > "$RUNNER_TEMP/slow-restore/tar" <<'TAR'
          #!/bin/bash
          if [[ "$1" == "-xf" ]]; then
            trap '' INT TERM
            exec /usr/bin/tar --checkpoint=1 --checkpoint-action=sleep=600 "$@"
          fi
          exec /usr/bin/tar "$@"
          TAR
          chmod 700 "$RUNNER_TEMP/slow-restore/tar"
          echo "$RUNNER_TEMP/slow-restore" >> "$GITHUB_PATH"
          date +%s.%N > "$FAULT_EVIDENCE/restore-started"
      - name: Restore with the real pinned action and deadline
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        timeout-minutes: 2
        continue-on-error: true
        env:
          BAZEL_DEPENDENCY_RESTORE_WRITER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        with:
          path: ~/.cache/bazel-repo
          key: bazel-extraction-fault-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stop owned extractors and run real preparation
        env:
          BAZEL_DEPENDENCY_RESTORE_MARKER: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          RESTORE_OUTCOME: ${{ steps.dependencies.outcome }}
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.dependencies.outputs.cache-matched-key }}
        run: |
          date +%s.%N > "$FAULT_EVIDENCE/restore-completed"
          mv "$RUNNER_TEMP/slow-restore/tar" "$FAULT_EVIDENCE/tar-fault-wrapper"
          script="$PWD/.github/scripts/bazel_dependencies.py"
          cd "$FAULT_WORKSPACE"
          python3 "$script" prepare | tee "$FAULT_EVIDENCE/preparation.log"
      - name: Require stopped writers, clean fallback, and valid workload
        env:
          RESTORE_OUTCOME: ${{ steps.dependencies.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['FAULT_EVIDENCE'])
          d=json.loads((p/'preparation.log').read_text())
          elapsed=float((p/'restore-completed').read_text())-float((p/'restore-started').read_text())
          assert os.environ['RESTORE_OUTCOME']=='failure'
          assert elapsed>=120
          assert d['preparation_exit_status']==0 and d['stopped_restore_writers']>=1
          assert d['discarded_unconfirmed_state']
          cache=pathlib.Path.home()/'.cache/bazel-repo'
          assert not (cache/'material').exists() and not (cache/'incomplete-restore').exists()
          requests=[json.loads(line) for line in (p/'requests.jsonl').read_text().splitlines()]
          assert any(r['path']=='/dependency' for r in requests)
          d.update(restore_seconds=elapsed,cancellation_overhead_seconds=elapsed-120,scope='Isolated public entry with a GNU tar checkpoint stall. The pinned action reached its real step deadline.')
          (p/'extraction-timeout.json').write_text(json.dumps(d,indent=2)+'\n')
          print(json.dumps(d))
          PY
          cd "$FAULT_WORKSPACE"
          bazel build --config=ci //:fixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: extraction-timeout-${{ github.run_id }}
          path: ${{ runner.temp }}/bazel-dependency-faults/
          if-no-files-found: error
