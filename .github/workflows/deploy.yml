name: Deploy

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  workflow_run:
    workflows: ["Bazel Tests"]
    types:
      - completed
    branches: [main]

env:
  MISE_EXPERIMENTAL: true

jobs:
  deploy:
    runs-on: ubuntu-22.04 # glibc version 2.36 is required for base distroless image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - uses: bazel-contrib/setup-bazel@5528b8082a800fc1dcf8ff0de93a30fa1c061239
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true

      - name: Copy API key to root .bazelrc
        run: |
          echo "=== Adding BuildBuddy API key to .bazelrc ==="
          echo "build --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" >> ~/.bazelrc

        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Put ci.bazelrc contents into ~/.bazelrc
        run: |
          cat $GITHUB_WORKSPACE/.github/workflows/ci.bazelrc >> ~/.bazelrc

      - name: Log in to GHCR
        uses: docker/login-action@28fdb31ff34708d19615a74d67103ddc2ea9725c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Nicknamer Server Image
        run: bazel run --compilation_mode=opt //nicknamer/server:push_image

      - name: Push Mindreadr Server Image
        run: bazel run --compilation_mode=opt //mindreadr:push_image

      - name: Push Mindreadr Frontend Image
        run: bazel run --compilation_mode=opt //angular/projects/mindreadr:push_image
      
      - name: Push Personal Website Image
        run: bazel run --compilation_mode=opt //personal_website:push_image
