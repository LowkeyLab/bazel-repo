name: Deploy
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
on:
  workflow_run:
    workflows: ["Bazel Tests"]
    types:
      - completed
    branches: [main]
env:
  MISE_EXPERIMENTAL: true
jobs:
  discover:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      targets: ${{ steps.query.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@7ff4255e941f2652381d81e4e6e2b4965680091d
        with:
          bazelisk-cache: true
          bazelrc: |
            common --config=ci
            build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Discover OCI push targets
        id: query
        run: |
          targets=$(bazel query 'kind("oci_push rule", //...)' | jq -Rnc '[inputs]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  push:
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@7ff4255e941f2652381d81e4e6e2b4965680091d
        with:
          bazelisk-cache: true
          bazelrc: |
            common --config=ci
            common --compilation_mode=opt
            build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Log in to GHCR
        uses: docker/login-action@c144859092e8e353f3e118b0b329679a62351c3e
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: bazel run --compilation_mode=opt ${{ matrix.target }}
