name: Deploy

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  workflow_run:
    workflows: ["Bazel Tests"]
    types:
      - completed
    branches: [main]

env:
  MISE_EXPERIMENTAL: true

jobs:
  deploy:
    runs-on: ubuntu-22.04 # glibc version 2.36 is required for base distroless image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@4432ac8a2318fb254c5b9fe491b9d21a002d7122
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true

      - name: Copy API key to root .bazelrc
        run: |
          echo "=== Adding BuildBuddy API key to .bazelrc ==="
          echo "build --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" >> ~/.bazelrc

        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Put ci.bazelrc contents into ~/.bazelrc
        run: |
          cat $GITHUB_WORKSPACE/.github/workflows/ci.bazelrc >> ~/.bazelrc

      - name: Install tools via bazel
        run: |
          echo "bazel-out/bazel_env-opt/bin/tools/bazel_env/bin" >> $GITHUB_PATH

      - name: Log in to GHCR
        uses: docker/login-action@28fdb31ff34708d19615a74d67103ddc2ea9725c
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Nicknamer Server Image
        run: bazel run --config=ci --compilation_mode=opt //nicknamer/server:push_image
      
      - name: Push RBE Bookworm Image
        run: bazel run --config=ci --compilation_mode=opt //rbe-image:push_image
