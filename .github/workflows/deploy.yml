name: Deploy
permissions:
  contents: read
  packages: write
  id-token: write
on:
  workflow_run:
    workflows: ["Bazel Tests"]
    types:
      - completed
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Prepare Aspect from public cache
        uses: ./.github/actions/install-nix-tool
        id: aspect
        with:
          tool: aspect
          cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          public-key: ${{ vars.CACHIX_PUBLIC_KEY }}
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          bazelrc: |
            common --config=ci
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Install Aspect from flake
        env:
          ASPECT_PATH: ${{ steps.aspect.outputs.path }}
        run: install -Dm755 "$ASPECT_PATH/bin/aspect" /usr/local/bin/aspect
      - name: Check Aspect delivery flags
        run: nix build .#checks.x86_64-linux.aspect-delivery-flags --no-link
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deliver OCI images
        env:
          ASPECT_API_TOKEN: ${{ secrets.ASPECT_API_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: aspect delivery --mode=always --track-state=false
