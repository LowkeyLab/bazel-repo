name: Deploy
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
on:
  workflow_run:
    workflows: ["Bazel Tests"]
    types:
      - completed
    branches: [main]
env:
  MISE_EXPERIMENTAL: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@887da5f6b9aa3c4c148b413f2cf21ee5dac91ef5
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          bazelrc: |
            common --config=ci
            common --compilation_mode=opt
            build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878
      - name: Log in to GHCR
        uses: docker/login-action@3227f5311cb93ffd14d13e65d8cc400d30f4dd8a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push All Images
        run: bazel query 'kind("oci_push rule", //...)' | xargs -n 1 bazel run --compilation_mode=opt
