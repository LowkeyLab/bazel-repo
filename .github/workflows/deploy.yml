name: Deploy

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

on:
  workflow_run:
    workflows: ["Bazel Tests"]
    types:
      - completed
    branches: [main]

env:
  MISE_EXPERIMENTAL: true

jobs:
  deploy:
    runs-on: ubuntu-22.04 # glibc version 2.36 is required for base distroless image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
      
      - uses: jdx/mise-action@156251fcc627ac4e26cb0f93dd47d1d4979abf24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: bazel run //nicknamer/server:push_image -c opt --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
        env:
          BUILDBUDDY_API_KEY: ${{secrets.BUILDBUDDY_API_KEY}}