name: Bazel Tests
permissions:
  contents: read
  pull-requests: write
  packages: write
  attestations: write
  id-token: write
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  MISE_EXPERIMENTAL: true
jobs:
  prepare:
    uses: ./.github/workflows/prepare-nix-tools.yml
    permissions:
      contents: read
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  format:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bazel-ci
        with:
          cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          public-key: ${{ vars.CACHIX_PUBLIC_KEY }}
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          docker-hub-username: ${{ vars.DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Check formatting
        run: |
          aspect format
  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bazel-ci
        with:
          cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          public-key: ${{ vars.CACHIX_PUBLIC_KEY }}
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          docker-hub-username: ${{ vars.DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Run Bazel Lints
        run: |
          aspect lint //...
  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bazel-ci
        with:
          cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          public-key: ${{ vars.CACHIX_PUBLIC_KEY }}
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          docker-hub-username: ${{ vars.DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Run Bazel tests
        run: |
          aspect test //...
