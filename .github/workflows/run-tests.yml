name: Bazel Tests
permissions:
  contents: read
  pull-requests: write
  packages: write
  attestations: write
  id-token: write
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  MISE_EXPERIMENTAL: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@30962902d2fd41169beb19c051e47c540c7d052a
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          bazelrc: |
            common --config=ci
            build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            test --test_env=XDG_CACHE_HOME
      - name: Log in to Docker Hub
        uses: docker/login-action@9fe7774c8f8ebfade96f0a62aa10f3882309d517
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416
      - name: Install Aspect CLI
        uses: jaxxstorm/action-install-gh-release@6096f2a2bbfee498ced520b6922ac2c06e990ed2 # v2.1.0
        with:
          repo: aspect-build/aspect-cli
          tag: v2026.4.2
          extension-matching: disable
          rename-to: aspect
      - name: Run Bazel Lints
        run: |
          aspect lint //...
      - name: Run Bazel tests
        run: |
          aspect test //...
