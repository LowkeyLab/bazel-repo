name: Bazel Tests

permissions:
  contents: read
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MISE_EXPERIMENTAL: true

jobs:
  ci:
    runs-on: ubuntu-22.04 # glibc version 2.36 is required for base distroless image
    steps:
      - uses: actions/checkout@v5

      - uses: bazel-contrib/setup-bazel@4432ac8a2318fb254c5b9fe491b9d21a002d7122
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true

      - name: Copy API key to root .bazelrc
        run: |
          echo "=== Adding BuildBuddy API key to .bazelrc ==="
          echo "build --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" >> ~/.bazelrc

        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Install tools via bazel
        run: |
          echo "bazel-out/bazel_env-opt/bin/tools/bazel_env/bin" >> $GITHUB_PATH

      - name: Log in to Docker Hub
        uses: docker/login-action@28fdb31ff34708d19615a74d67103ddc2ea9725c
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Setup Testcontainers Cloud Client
        uses: atomicjar/testcontainers-cloud-setup-action@7d1bab3fdfe0027c91936deca6b924d8a8a7a04d
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}

      - uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416

      - name: Run Bazel tests
        run: |
          bazel \
            --bazelrc=$GITHUB_WORKSPACE/.github/workflows/ci.bazelrc \
            test \
            --config=ci \
            //...
