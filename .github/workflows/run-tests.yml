name: Bazel Tests
permissions:
  contents: read
  pull-requests: write
  packages: write
  attestations: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      browser-acceptance:
        description: Run fresh remote Book Smartz browser acceptance
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  MISE_EXPERIMENTAL: true
jobs:
  prepare:
    uses: ./.github/workflows/prepare-nix-tools.yml
    permissions:
      contents: read
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  format:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bazel-ci
        with:
          cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          public-key: ${{ vars.CACHIX_PUBLIC_KEY }}
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          docker-hub-username: ${{ vars.DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Check formatting
        run: |
          aspect format
  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bazel-ci
        with:
          cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          public-key: ${{ vars.CACHIX_PUBLIC_KEY }}
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          docker-hub-username: ${{ vars.DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Run Bazel Lints
        run: |
          aspect lint //...
  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bazel-ci
        with:
          repository-cache: 'false'
          cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          public-key: ${{ vars.CACHIX_PUBLIC_KEY }}
          aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          docker-hub-username: ${{ vars.DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Configure shared dependency cache
        run: python3 .github/scripts/bazel_dependencies.py configure
      - name: Restore Bazel dependencies (advisory)
        id: dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ env.BAZEL_DEPENDENCY_CACHE }}
          key: ${{ env.BAZEL_DEPENDENCY_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.BAZEL_DEPENDENCY_PREFIX }}
      - name: Prepare dependencies (required)
        id: preparation
        env:
          RESTORE_OUTCOME: ${{ steps.dependencies.outcome }}
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.dependencies.outputs.cache-matched-key }}
        run: python3 .github/scripts/bazel_dependencies.py prepare
      - name: Run Bazel tests
        id: workload
        run: |
          aspect test //...
      - name: Verify fresh remote browser acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.browser-acceptance
        timeout-minutes: 20
        run: |
          invocation=$(cat /proc/sys/kernel/random/uuid)
          {
            echo "Browser acceptance commit: $(git rev-parse HEAD)"
            echo "Hosted run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "BuildBuddy: https://app.buildbuddy.io/invocation/$invocation"
            echo "Inspect the browser TestRunner execution; require remote execution, no cache hit, and the pinned worker."
          } >> "$GITHUB_STEP_SUMMARY"
          aspect test //book_smartz/web:browser_test \
            --invocation_id="$invocation" \
            --strategy=TestRunner=remote \
            --nocache_test_results --noremote_accept_cached \
            --noremote_local_fallback --test_output=all
      - name: Evaluate dependency publication
        id: publication
        if: always()
        env:
          PREPARATION_OUTCOME: ${{ steps.preparation.outcome }}
          TEST_OUTCOME: ${{ steps.workload.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: python3 .github/scripts/bazel_dependencies.py publication
      - name: Inspect dependency material before publication
        if: success() && steps.publication.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASPECT_API_TOKEN: ${{ secrets.ASPECT_API_TOKEN }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: python3 .github/scripts/bazel_dependencies.py inspect
      - name: Save refreshed Bazel dependencies (advisory)
        id: dependency-save
        if: success() && steps.publication.outputs.eligible == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ env.BAZEL_DEPENDENCY_CACHE }}
          key: ${{ env.BAZEL_DEPENDENCY_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record dependency save step outcome
        if: always()
        env:
          SAVE_OUTCOME: ${{ steps.dependency-save.outcome }}
        run: |
          printf '\nDependency save step outcome: %s. Inspect the pinned action log for the saved entry or transport warning.\n' "$SAVE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain dependency snapshot inventory
        if: always() && steps.publication.outputs.eligible == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bazel-dependency-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bazel-dependency-inventory.json
          if-no-files-found: warn
