name: Temporary native dependency-cache probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 459c71378774e3746230e7c817d7b216eee6d0d5
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          repository-cache: false
      - name: Check native reuse and integrity on a fresh runner
        run: |
          cat > "$RUNNER_TEMP/native-probe.py" <<'PYTHON'
          import hashlib
          import http.server
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          import threading
          import time

          root = Path(tempfile.mkdtemp(prefix='native-', dir=os.environ['RUNNER_TEMP']))
          requests = []
          payloads = {'a': b'public dependency one\n', 'b': b'public dependency two\n'}
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  key = self.path.strip('/')
                  body = payloads.get(key)
                  requests.append({'path': self.path, 'bytes': len(body or b'')})
                  self.send_response(200 if body else 404)
                  self.end_headers()
                  if body: self.wfile.write(body)
              def log_message(self, *_): pass
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 18643), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()
          workspace = root/'workspace'
          workspace.mkdir()
          (workspace/'BUILD.bazel').write_text('')
          (workspace/'deps.bzl').write_text('''def _repo(ctx):
              print("RULE_EXECUTED")
              ctx.download(url = ctx.attr.url, output = "material", sha256 = ctx.attr.sha256)
              ctx.file("BUILD.bazel", 'exports_files(["material"])\\n')
              return ctx.repo_metadata(reproducible = True)
          repo = repository_rule(implementation = _repo, attrs = {"url": attr.string(), "sha256": attr.string()})
          ''')
          cache=root/'cache'
          results=[]
          def run(name, payload='a', contents=True, version='9.3.1', cache_dir=None):
              cache_dir=cache_dir or cache
              sha=hashlib.sha256(payloads[payload]).hexdigest()
              (workspace/'MODULE.bazel').write_text(f'''module(name = "native_probe")
          repo = use_repo_rule("//:deps.bzl", "repo")
          repo(name = "fixture", url = "http://127.0.0.1:18643/{payload}", sha256 = "{sha}")
          ''')
              output=root/('output-'+name)
              started=time.monotonic(); before=len(requests)
              cmd=['bazel', '--batch','--nosystem_rc','--nohome_rc','--noworkspace_rc',f'--output_base={output}', 'query', '@fixture//:material',f'--repository_cache={cache_dir}',f'--repo_contents_cache={cache_dir / "contents" if contents else ""}','--incompatible_autoload_externally=']
              env=dict(os.environ,USE_BAZEL_VERSION=version)
              result=subprocess.run(cmd,cwd=workspace,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              (root/(name+'.log')).write_text(result.stdout)
              material=output/'external/+repo+fixture/material'
              candidates=list((output/'external').glob('*/material')) if (output/'external').exists() else []
              actual=candidates[0].read_bytes() if candidates else None
              row={'name':name,'version':version,'seconds':time.monotonic()-started,'exit':result.returncode,'requests':requests[before:],'rule_executed':'RULE_EXECUTED' in result.stdout,'correct':actual==payloads[payload],'command':cmd}
              results.append(row); print(json.dumps(row),flush=True)
              (root/'results.json').write_text(json.dumps(results,indent=2)+'\n')
              return row
          try:
              a=run('cold',version='9.3.0')
              if not a['correct']: raise RuntimeError('Cold fixture failed')
              a=run('archive-only',contents=False,version='9.3.0')
              assert a['correct'] and a['rule_executed'] and not a['requests'],a
              a=run('contents',version='9.3.0')
              assert a['correct'] and not a['rule_executed'] and not a['requests'],a
              a=run('version-transition')
              assert a['correct'],a
              a=run('input-change','b')
              assert a['correct'] and a['requests'],a
              a=run('later-addition-reuse','b')
              assert a['correct'] and not a['requests'],a
              a=run('schema-invalidation','b',cache_dir=root/'new-schema')
              assert a['correct'] and a['requests'],a
              sha=hashlib.sha256(payloads['a']).hexdigest()
              archive=cache/'content_addressable'/'sha256'/sha/'file'
              print('archive',archive,archive.exists(),flush=True)
              archive.write_bytes(b'corrupted cache data\n')
              a=run('corrupt-archive',contents=False)
              print('CORRUPTION_RESULT',a['correct'],a['exit'],flush=True)
          finally:
              server.shutdown()
              print('EVIDENCE',root,flush=True)
          PYTHON
          python3 "$RUNNER_TEMP/native-probe.py"
      - name: Record runner and tool identity
        if: always()
        run: |
          printf 'Revision: %s\nRunner: %s\nRef: %s\n' "$GITHUB_SHA" "$RUNNER_NAME" "$GITHUB_REF" > "$RUNNER_TEMP/native-provenance.txt"
          bazel version >> "$RUNNER_TEMP/native-provenance.txt"
          uname -a >> "$RUNNER_TEMP/native-provenance.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-dependency-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-*/results.json
            ${{ runner.temp }}/native-*/*.log
            ${{ runner.temp }}/native-provenance.txt
          if-no-files-found: error
