name: Coverage
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  MISE_EXPERIMENTAL: true
jobs:
  prepare-nix-tools:
    uses: ./.github/workflows/prepare-nix-tools.yml
    with:
      tool: lcov
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  coverage:
    needs: prepare-nix-tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare lcov from public cache
        uses: ./.github/actions/install-nix-tool
        id: lcov
        with:
          tool: lcov
          cache-name: ${{ vars.CACHIX_CACHE_NAME }}
          public-key: ${{ vars.CACHIX_PUBLIC_KEY }}
      - uses: bazel-contrib/setup-bazel@d68576867819dfdec2cf9586a68795f81461da3e
        with:
          bazelisk-cache: true
          bazelrc: |
            common --config=ci
            common --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}
            test --test_env=XDG_CACHE_HOME
      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Install lcov from Nix
        env:
          LCOV_PATH: ${{ steps.lcov.outputs.path }}
        run: |
          install -m755 "$LCOV_PATH/bin/lcov" "$LCOV_PATH/bin/genhtml" "$LCOV_PATH/bin/geninfo" /usr/local/bin/
      - name: Run Coverage
        run: |
          git rev-parse HEAD > coverage-revision.txt
          bazel run //tools/coverage -- //... --build_event_json_file="$RUNNER_TEMP/coverage.bep.json"
          cp coverage-javascript/receipt.json coverage-javascript-receipt.json
          jq -c 'select(has("testResult") or has("testSummary") or has("finished"))' "$RUNNER_TEMP/coverage.bep.json" > coverage-test-results.jsonl
      - name: Check Python membership
        id: python_membership
        env:
          BUILD_WORKSPACE_DIRECTORY: ${{ github.workspace }}
        run: |
          cp coverage-report.lcov "$RUNNER_TEMP/all-targets.lcov"
          cp coverage-inventory.json "$RUNNER_TEMP/all-targets-inventory.json"
          cp coverage-go-baselines.json "$RUNNER_TEMP/all-targets-go-baselines.json"
          cp coverage-rust-baselines.json "$RUNNER_TEMP/all-targets-rust-baselines.json"
          bazel run //tools/python:coverage_baseline.venv -- --dest "$RUNNER_TEMP" --name coverage-venv
          collector="$RUNNER_TEMP/coverage-venv/bin/python"
          "$collector" -m coverage run --rcfile=/dev/null --branch \
            --include=tools/python/coverage_membership_test.py \
            --data-file="$RUNNER_TEMP/membership.coverage" \
            tools/python/coverage_membership_test.py "$RUNNER_TEMP/python-membership" --execution remote
          "$collector" -m coverage lcov --rcfile=/dev/null \
            --data-file="$RUNNER_TEMP/membership.coverage" \
            -o coverage-membership.lcov
          printf '%s\n' "$RUNNER_TEMP/all-targets.lcov" "$GITHUB_WORKSPACE/coverage-membership.lcov" > "$RUNNER_TEMP/coverage-reports.txt"
          bazel run @bazel_tools//tools/test:lcov_merger -- \
            --reports_file="$RUNNER_TEMP/coverage-reports.txt" \
            --output_file="$GITHUB_WORKSPACE/coverage-report.lcov"
          cp "$RUNNER_TEMP/all-targets-inventory.json" coverage-inventory.json
          cp "$RUNNER_TEMP/all-targets-go-baselines.json" coverage-go-baselines.json
          cp "$RUNNER_TEMP/all-targets-rust-baselines.json" coverage-rust-baselines.json
          cp "$RUNNER_TEMP/python-membership/test-results.json" coverage-membership-test-results.json
          cp "$RUNNER_TEMP/python-membership/combined.lcov" coverage-membership-combined.lcov
      - name: Check Go membership
        env:
          BUILD_WORKSPACE_DIRECTORY: ${{ github.workspace }}
        run: |
          cp coverage-report.lcov "$RUNNER_TEMP/all-targets-go.lcov"
          cp coverage-inventory.json "$RUNNER_TEMP/all-targets-go-inventory.json"
          cp coverage-go-baselines.json "$RUNNER_TEMP/all-targets-go-baselines-after-python.json"
          cp coverage-rust-baselines.json "$RUNNER_TEMP/all-targets-rust-baselines-after-python.json"
          collector="$RUNNER_TEMP/coverage-venv/bin/python"
          "$collector" -m coverage run --rcfile=/dev/null --branch \
            --include=tools/coverage/go_membership_test.py \
            --data-file="$RUNNER_TEMP/go-membership.coverage" \
            tools/coverage/go_membership_test.py --evidence "$RUNNER_TEMP/go-membership"
          "$collector" -m coverage lcov --rcfile=/dev/null \
            --data-file="$RUNNER_TEMP/go-membership.coverage" \
            -o coverage-go-membership.lcov
          printf '%s\n' "$RUNNER_TEMP/all-targets-go.lcov" "$GITHUB_WORKSPACE/coverage-go-membership.lcov" > "$RUNNER_TEMP/go-coverage-reports.txt"
          bazel run @bazel_tools//tools/test:lcov_merger -- \
            --reports_file="$RUNNER_TEMP/go-coverage-reports.txt" \
            --output_file="$GITHUB_WORKSPACE/coverage-report.lcov"
          cp "$RUNNER_TEMP/all-targets-go-inventory.json" coverage-inventory.json
          cp "$RUNNER_TEMP/all-targets-go-baselines-after-python.json" coverage-go-baselines.json
          cp "$RUNNER_TEMP/all-targets-rust-baselines-after-python.json" coverage-rust-baselines.json
      - name: Check Rust membership
        id: rust_membership
        env:
          BUILD_WORKSPACE_DIRECTORY: ${{ github.workspace }}
        run: |
          cp coverage-report.lcov "$RUNNER_TEMP/all-targets-rust.lcov"
          cp coverage-inventory.json "$RUNNER_TEMP/all-targets-rust-inventory.json"
          cp coverage-go-baselines.json "$RUNNER_TEMP/all-targets-go-baselines-before-rust.json"
          cp coverage-rust-baselines.json "$RUNNER_TEMP/all-targets-rust-baselines-before-rust.json"
          collector="$RUNNER_TEMP/coverage-venv/bin/python"
          "$collector" -m coverage run --rcfile=/dev/null --branch \
            --include=tools/coverage/rust_membership_test.py \
            --data-file="$RUNNER_TEMP/rust-membership.coverage" \
            tools/coverage/rust_membership_test.py --execution configured --evidence "$RUNNER_TEMP/rust-membership"
          "$collector" -m coverage lcov --rcfile=/dev/null \
            --data-file="$RUNNER_TEMP/rust-membership.coverage" \
            -o coverage-rust-membership.lcov
          printf '%s\n' "$RUNNER_TEMP/all-targets-rust.lcov" "$GITHUB_WORKSPACE/coverage-rust-membership.lcov" > "$RUNNER_TEMP/rust-coverage-reports.txt"
          bazel run @bazel_tools//tools/test:lcov_merger -- \
            --reports_file="$RUNNER_TEMP/rust-coverage-reports.txt" \
            --output_file="$GITHUB_WORKSPACE/coverage-report.lcov"
          cp "$RUNNER_TEMP/all-targets-rust-inventory.json" coverage-inventory.json
          cp "$RUNNER_TEMP/all-targets-go-baselines-before-rust.json" coverage-go-baselines.json
          cp "$RUNNER_TEMP/all-targets-rust-baselines-before-rust.json" coverage-rust-baselines.json
      - name: Check JVM membership
        env:
          BUILD_WORKSPACE_DIRECTORY: ${{ github.workspace }}
        run: |
          cp coverage-report.lcov "$RUNNER_TEMP/all-targets-jvm.lcov"
          cp coverage-inventory.json "$RUNNER_TEMP/all-targets-jvm-inventory.json"
          cp coverage-go-baselines.json "$RUNNER_TEMP/all-targets-go-baselines-before-jvm.json"
          cp coverage-rust-baselines.json "$RUNNER_TEMP/all-targets-rust-baselines-before-jvm.json"
          collector="$RUNNER_TEMP/coverage-venv/bin/python"
          "$collector" -m coverage run --rcfile=/dev/null --branch \
            --include=tools/coverage/jvm_membership_test.py \
            --data-file="$RUNNER_TEMP/jvm-membership.coverage" \
            tools/coverage/jvm_membership_test.py --execution configured --evidence "$RUNNER_TEMP/jvm-membership"
          "$collector" -m coverage lcov --rcfile=/dev/null \
            --data-file="$RUNNER_TEMP/jvm-membership.coverage" \
            -o coverage-jvm-membership.lcov
          printf '%s\n' "$RUNNER_TEMP/all-targets-jvm.lcov" "$GITHUB_WORKSPACE/coverage-jvm-membership.lcov" > "$RUNNER_TEMP/jvm-coverage-reports.txt"
          bazel run @bazel_tools//tools/test:lcov_merger -- \
            --reports_file="$RUNNER_TEMP/jvm-coverage-reports.txt" \
            --output_file="$GITHUB_WORKSPACE/coverage-report.lcov"
          cp "$RUNNER_TEMP/all-targets-jvm-inventory.json" coverage-inventory.json
          cp "$RUNNER_TEMP/all-targets-go-baselines-before-jvm.json" coverage-go-baselines.json
          cp "$RUNNER_TEMP/all-targets-rust-baselines-before-jvm.json" coverage-rust-baselines.json
      - name: Check JavaScript membership
        id: javascript_membership
        env:
          BUILD_WORKSPACE_DIRECTORY: ${{ github.workspace }}
        run: |
          cp coverage-report.lcov "$RUNNER_TEMP/all-targets-javascript.lcov"
          cp coverage-inventory.json "$RUNNER_TEMP/all-targets-javascript-inventory.json"
          cp coverage-go-baselines.json "$RUNNER_TEMP/all-targets-go-baselines-before-javascript.json"
          cp coverage-rust-baselines.json "$RUNNER_TEMP/all-targets-rust-baselines-before-javascript.json"
          collector="$RUNNER_TEMP/coverage-venv/bin/python"
          "$collector" -m coverage run --rcfile=/dev/null --branch \
            --include=tools/coverage/javascript_membership_test.py \
            --data-file="$RUNNER_TEMP/javascript-membership.coverage" \
            tools/coverage/javascript_membership_test.py --execution configured --evidence "$RUNNER_TEMP/javascript-membership"
          "$collector" -m coverage lcov --rcfile=/dev/null \
            --data-file="$RUNNER_TEMP/javascript-membership.coverage" \
            -o coverage-javascript-membership.lcov
          printf '%s\n' "$RUNNER_TEMP/all-targets-javascript.lcov" "$GITHUB_WORKSPACE/coverage-javascript-membership.lcov" > "$RUNNER_TEMP/javascript-coverage-reports.txt"
          bazel run @bazel_tools//tools/test:lcov_merger -- \
            --reports_file="$RUNNER_TEMP/javascript-coverage-reports.txt" \
            --output_file="$GITHUB_WORKSPACE/coverage-report.lcov"
          cp "$RUNNER_TEMP/all-targets-javascript-inventory.json" coverage-inventory.json
          cp "$RUNNER_TEMP/all-targets-go-baselines-before-javascript.json" coverage-go-baselines.json
          cp "$RUNNER_TEMP/all-targets-rust-baselines-before-javascript.json" coverage-rust-baselines.json
      - name: Retain Python membership evidence
        if: ${{ always() && steps.python_membership.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-coverage-membership-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/python-membership/*.lcov
            ${{ runner.temp }}/python-membership/commands.jsonl
            ${{ runner.temp }}/python-membership/test-results.json
            ${{ runner.temp }}/python-membership/revision.txt
            ${{ runner.temp }}/python-membership/coverage.log
            ${{ runner.temp }}/python-membership/coverage.exit
          if-no-files-found: error
          retention-days: 30
      - name: Retain JavaScript coverage evidence
        if: ${{ always() && steps.javascript_membership.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: javascript-coverage-membership-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-javascript
            ${{ runner.temp }}/javascript-membership
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain Rust membership evidence
        if: ${{ always() && steps.rust_membership.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-membership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-membership
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain Go membership evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-coverage-membership-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-membership
          if-no-files-found: error
          retention-days: 30
      - name: Retain coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-report.lcov
            coverage-inventory.json
            coverage-go-baselines.json
            coverage-rust-baselines.json
            coverage-test-results.jsonl
            coverage-revision.txt
            coverage-membership.lcov
            coverage-go-membership.lcov
            coverage-rust-membership.lcov
            coverage-jvm-membership.lcov
            coverage-javascript-membership.lcov
            coverage-javascript-receipt.json
            coverage-membership-test-results.json
            coverage-membership-combined.lcov
          if-no-files-found: error
          retention-days: 30
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage-report.lcov
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
